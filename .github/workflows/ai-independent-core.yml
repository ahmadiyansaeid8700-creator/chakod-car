name: Independent AI Core

on:
  pull_request:
    branches:
      - backup-latest-2026-08-03
    paths:
      - "app/api/ai/assistant/**"
      - "lib/ai-assistant/**"
      - "tests/ai-assistant-offline.test.mjs"
      - "docs/AI-ASSISTANT-CHECKLIST-FA.md"
      - ".github/workflows/ai-independent-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-ai-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test independent AI core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run independent AI tests
        run: node --experimental-strip-types --test tests/ai-assistant-offline.test.mjs

      - name: Lint affected files
        run: >-
          npx eslint
          lib/ai-assistant/offline.ts
          app/api/ai/assistant/route.ts
          tests/ai-assistant-offline.test.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check full-build prerequisites
        id: build_prerequisites
        shell: bash
        run: |
          if [[ -f .openai/hosting.json && -e build/sites-vite-plugin ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Full build skipped because repository-local hosting prerequisites are not present in CI."
          fi

      - name: Run verified build
        if: steps.build_prerequisites.outputs.ready == 'true'
        run: npm run build
