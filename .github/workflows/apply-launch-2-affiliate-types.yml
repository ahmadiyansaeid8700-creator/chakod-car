name: Apply Launch-2 Affiliate type patch

on:
  push:
    branches:
      - agent/launch-2-affiliate-types
    paths:
      - ".github/workflows/apply-launch-2-affiliate-types.yml"

permissions:
  contents: write

jobs:
  apply-patch:
    name: Apply exact Affiliate header type patch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-2-affiliate-types

      - name: Apply exact replacements
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const patches = [
            {
              path: 'app/account/affiliate/AffiliateAccountClient.tsx',
              from: 'function tokenHeaders(){',
              to: 'function tokenHeaders(): Record<string, string>{',
            },
            {
              path: 'app/admin/affiliate/AffiliateAdminClient.tsx',
              from: 'function tokenHeaders() {',
              to: 'function tokenHeaders(): Record<string, string> {',
            },
          ];

          for (const patch of patches) {
            const source = fs.readFileSync(patch.path, 'utf8');
            const matches = source.split(patch.from).length - 1;
            if (matches !== 1) {
              throw new Error(`${patch.path}: expected exactly one match, found ${matches}`);
            }
            fs.writeFileSync(patch.path, source.replace(patch.from, patch.to));
          }
          NODE

      - name: Commit exact source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/account/affiliate/AffiliateAccountClient.tsx \
            app/admin/affiliate/AffiliateAdminClient.tsx
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes were produced."; exit 1; }
          git commit -m "fix Affiliate request header types"
          git push origin HEAD:agent/launch-2-affiliate-types
