name: Apply safe npm audit fix

on:
  push:
    branches:
      - security/staging-dependency-hardening-2026-08-28

permissions:
  contents: write

jobs:
  safe-audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/staging-dependency-hardening-2026-08-28
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify clean install
        run: npm ci

      - name: Show remaining audit inventory
        run: npm audit --audit-level=critical

      - name: Commit safe audit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No safe audit lockfile changes were available.'
            exit 0
          fi
          git commit -m 'chore: apply safe npm audit lockfile fixes'
          git push origin HEAD:security/staging-dependency-hardening-2026-08-28
