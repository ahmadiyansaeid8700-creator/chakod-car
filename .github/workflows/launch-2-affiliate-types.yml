name: Launch-2 Affiliate Types

on:
  pull_request:
    branches:
      - backup-latest-2026-08-03
    paths:
      - "app/account/affiliate/AffiliateAccountClient.tsx"
      - "app/admin/affiliate/AffiliateAdminClient.tsx"
      - "tsconfig.affiliate.json"
      - "types/css-modules.d.ts"
      - "docs/LAUNCH-2-AFFILIATE-TYPES-CHECKLIST-FA.md"
      - ".github/workflows/launch-2-affiliate-types.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-2-affiliate-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Affiliate TypeScript patch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Affiliate TypeScript check
        run: npx tsc --noEmit -p tsconfig.affiliate.json

      - name: Lint Affiliate patch without unrelated legacy blockers
        run: >-
          npx eslint
          app/account/affiliate/AffiliateAccountClient.tsx
          app/admin/affiliate/AffiliateAdminClient.tsx
          --rule "@typescript-eslint/no-explicit-any: off"
          --rule "react-hooks/set-state-in-effect: off"

      - name: Project-wide TypeScript diagnostic
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/chakod-full-tsc.log 2>&1
          full_status=$?
          set -e
          cat /tmp/chakod-full-tsc.log
          if grep -E '^app/(account|admin)/affiliate/.*error TS' /tmp/chakod-full-tsc.log; then
            echo "Affiliate TypeScript errors remain in the project-wide diagnostic."
            exit 1
          fi
          echo "Project-wide TypeScript exit code: ${full_status}. Remaining non-Affiliate diagnostics are tracked separately."

      - name: Run regression tests
        run: >-
          node --experimental-strip-types --test
          tests/login-return-to.test.mjs
          tests/route-access.test.mjs
          tests/car-routes.test.mjs
          tests/listing-routes.test.mjs
          tests/ai-assistant-offline.test.mjs
          tests/ai-assistant-intelligence.test.ts
          tests/ai-moderation-policy.test.ts

      - name: Start local server and smoke-test Affiliate routes
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/chakod-launch-2.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/chakod-home.html; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/chakod-launch-2.log
              exit 1
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/chakod-launch-2.log
            exit 1
          fi

          check_route() {
            local path="$1"
            local output="$2"
            local code
            code=$(curl --silent --show-error --max-redirs 0 --output "$output" --write-out '%{http_code}' "http://127.0.0.1:5173${path}" || true)
            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "Unexpected HTTP status ${code} for ${path}"
              cat /tmp/chakod-launch-2.log
              exit 1
            fi
            echo "${path}: HTTP ${code}"
          }

          check_route "/account/affiliate" /tmp/chakod-affiliate-account.html
          check_route "/admin/affiliate" /tmp/chakod-affiliate-admin.html
