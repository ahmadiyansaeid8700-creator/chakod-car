name: Launch 3 checks

on:
  push:
    branches:
      - agent/launch-3-local-baseline
  pull_request:
    branches:
      - main
      - agent/launch-3-local-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Launch source checks
        run: npm run check:launch

      - name: Verify Drizzle migrations on local D1
        run: npm run d1:verify

      - name: Critical dependency audit gate
        run: npm audit --audit-level=critical

      - name: Portable Vinext build preflight
        run: npm run build:preflight

      - name: Portable runtime smoke
        run: npm run smoke:portable
