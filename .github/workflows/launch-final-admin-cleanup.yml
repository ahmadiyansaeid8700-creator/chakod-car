name: One-shot final admin cleanup

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/launch-final-admin-cleanup.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply deterministic source cleanup
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function replaceRequired(file, before, after, label) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`Required source block not found: ${label}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceRequired(
            'app/admin/page.tsx',
            `          {canAuditServices && (\n            <article className="module pending" aria-disabled="true">\n              <span className="moduleIcon small">AI</span>\n              <b>گزارش‌ها و نظارت هوشمند</b>\n              <p>\n                گزارش تخلف، رویدادهای امنیتی و بازخورد نظارتی\n                ادمین‌ها.\n              </p>\n              <em>در حال ساخت</em>\n            </article>\n          )}`,
            `          {canAuditServices && (\n            <Link className="module active" href="/admin/audit-logs">\n              <span className="moduleIcon small">≡</span>\n              <b>گزارش تغییرات و نظارت</b>\n              <p>\n                رویدادهای مدیریتی و سوابق قابل ممیزی را از گزارش تغییرات\n                Commerce بررسی کن.\n              </p>\n              <em>ورود به بخش</em>\n            </Link>\n          )}`,
            'admin audit module',
          );

          replaceRequired(
            'app/admin/page.tsx',
            `                تعرفه‌ها، قیمت استان‌ها، پرداخت‌ها، اشتراک‌ها، بنرها\n                و سطح دسترسی مدیران را از داخل سایت کنترل کن.`,
            `                تعرفه‌ها، قیمت استان‌ها، پرداخت‌ها، اشتراک‌ها، تبلیغات\n                و سطح دسترسی مدیران را از داخل سایت کنترل کن.`,
            'admin commerce description',
          );

          replaceRequired(
            'app/admin/commerce/CommerceAdminClient.tsx',
            `  banners_view: "مشاهده رزروهای بنر",\n  banners_manage: "مدیریت رزروهای بنر",`,
            `  banners_view: "مشاهده سوابق تبلیغات Legacy",\n  banners_manage: "دسترسی سازگاری تبلیغات Legacy",`,
            'legacy banner capability labels',
          );

          replaceRequired(
            'app/admin/commerce/CommerceAdminClient.tsx',
            `  ["banners.view", "مشاهده بنرها"],\n  ["banners.manage", "تأیید و رد بنرها"],`,
            `  ["banners.view", "مشاهده سوابق تبلیغات Legacy"],\n  ["banners.manage", "دسترسی سازگاری تبلیغات Legacy"],`,
            'legacy banner permission labels',
          );

          replaceRequired(
            'app/admin/commerce/CommerceAdminClient.tsx',
            `  { key: "banner", title: "بنر صفحه اصلی", description: "رزرو روزانه بنر استانی", match: (key: string) => key.startsWith("home_banner") },\n`,
            ``,
            'legacy banner pricing group',
          );

          replaceRequired(
            'app/admin/commerce/CommerceAdminClient.tsx',
            `    if (caps?.banners_view) items.push({ key: "banners", label: "رزرو بنر" });\n`,
            ``,
            'legacy banner navigation tab',
          );

          replaceRequired(
            'app/admin/commerce/CommerceAdminClient.tsx',
            `    const source = data?.services || [];`,
            `    const source = (data?.services || []).filter((service) => !service.service_key.startsWith("home_banner"));`,
            'legacy banner pricing filter',
          );

          replaceRequired(
            'app/admin/commerce/CommerceAdminClient.tsx',
            `  review_banner: "بررسی رزرو بنر",`,
            `  review_banner: "بررسی سابقه تبلیغ Legacy",`,
            'legacy banner audit label',
          );
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Launch source checks
        run: npm run check:launch

      - name: Portable build
        run: npm run build:preflight

      - name: Portable runtime smoke
        run: npm run smoke:portable

      - name: Verify retired UI wording
        run: |
          if grep -n "در حال ساخت" app/admin/page.tsx; then
            echo "Admin placeholder still exists."
            exit 1
          fi
          if grep -n "بنر صفحه اصلی\|label: \"رزرو بنر\"" app/admin/commerce/CommerceAdminClient.tsx; then
            echo "Legacy banner product wording still exists in active Commerce UI."
            exit 1
          fi

      - name: Commit verified cleanup
        run: |
          if git diff --quiet -- app/admin/page.tsx app/admin/commerce/CommerceAdminClient.tsx; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx app/admin/commerce/CommerceAdminClient.tsx
          git commit -m "cleanup: retire remaining admin launch placeholders"
          git push origin HEAD:agent/launch-3-local-baseline
