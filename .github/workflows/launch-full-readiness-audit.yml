name: Full launch readiness audit

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/launch-full-readiness-audit.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Static UI route and CTA audit
        id: ui_audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/launch-ui-audit.mjs

      - name: Master sitemap route audit
        id: master_routes
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/master-route-audit.mjs

      - name: Source TypeScript and contract checks
        id: source_checks
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run check:launch

      - name: Dependency audit snapshot
        id: dependency_audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p artifacts
          node - <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const result = spawnSync('npm', ['audit', '--json'], { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 });
          fs.writeFileSync('artifacts/npm-audit.json', result.stdout || '');
          fs.writeFileSync('artifacts/npm-audit-stderr.txt', result.stderr || '');
          if (!result.stdout?.trim()) {
            console.error('npm audit returned an empty JSON payload.');
            process.exit(1);
          }
          try {
            const parsed = JSON.parse(result.stdout);
            if (!parsed?.metadata?.vulnerabilities) throw new Error('missing vulnerability metadata');
          } catch (error) {
            console.error('npm audit JSON is invalid:', error instanceof Error ? error.message : error);
            process.exit(1);
          }
          NODE
          npm audit --audit-level=critical > artifacts/npm-audit.txt 2>&1 || true

      - name: Portable production bundle
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build:preflight

      - name: Portable runtime smoke
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run smoke:portable

      - name: Create readiness summary
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UI_AUDIT: ${{ steps.ui_audit.outcome }}
          MASTER_ROUTES: ${{ steps.master_routes.outcome }}
          SOURCE_CHECKS: ${{ steps.source_checks.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p artifacts
          node - <<'NODE'
          const fs = require('fs');
          const env = process.env;
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync('artifacts/npm-audit.json', 'utf8')); } catch {}
          const v = audit?.metadata?.vulnerabilities || {};
          const lines = [
            '# Chakod full launch readiness audit',
            '',
            `- npm ci: ${env.INSTALL}`,
            `- static UI route/CTA audit: ${env.UI_AUDIT}`,
            `- master sitemap route coverage: ${env.MASTER_ROUTES}`,
            `- TypeScript + contract tests: ${env.SOURCE_CHECKS}`,
            `- dependency audit snapshot: ${env.DEPENDENCY_AUDIT}`,
            `- portable production bundle: ${env.BUILD}`,
            `- portable runtime smoke: ${env.SMOKE}`,
            `- vulnerabilities: critical=${v.critical ?? '?'}, high=${v.high ?? '?'}, moderate=${v.moderate ?? '?'}, low=${v.low ?? '?'}`,
            '',
            'External wallet settlement, bank refund and production D1 bindings still require staging credentials/bindings before launch can be declared.'
          ];
          fs.writeFileSync('artifacts/launch-readiness-summary.md', lines.join('\n') + '\n');
          NODE
          cat artifacts/launch-readiness-summary.md

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce repository readiness gates
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UI_AUDIT: ${{ steps.ui_audit.outcome }}
          MASTER_ROUTES: ${{ steps.master_routes.outcome }}
          SOURCE_CHECKS: ${{ steps.source_checks.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          if [ "$INSTALL" != success ] || [ "$UI_AUDIT" != success ] || [ "$MASTER_ROUTES" != success ] || [ "$SOURCE_CHECKS" != success ] || [ "$DEPENDENCY_AUDIT" != success ] || [ "$BUILD" != success ] || [ "$SMOKE" != success ]; then
            echo "At least one launch readiness gate failed."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('artifacts/npm-audit.json', 'utf8'));
          const critical = audit?.metadata?.vulnerabilities?.critical ?? 0;
          if (critical > 0) {
            console.error(`Critical vulnerabilities remain: ${critical}`);
            process.exit(1);
          }
          NODE
