name: Deploy production candidate

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/production-candidate-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chakod-production-candidate
  cancel-in-progress: false

jobs:
  deploy-production-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PRODUCTION_WORKER_NAME: chakod-car
      CLOUDFLARE_PRODUCTION_D1_DATABASE_NAME: chakod-staging
      CLOUDFLARE_PRODUCTION_D1_DATABASE_ID: c38ca246-c71b-4a64-98fb-d0c946da3cb9
      NEXT_PUBLIC_PRELAUNCH_FIXTURES: "false"
      PRELAUNCH_FIXTURES: "false"

    steps:
      - name: Checkout staging release source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release source
        run: npm run check:launch

      - name: Verify D1 migration chain locally
        run: npm run d1:verify

      - name: Ensure Cloudflare credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Confirm production domains are not attached
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             | node -e '
                const fs = require("fs");
                const payload = JSON.parse(fs.readFileSync(0, "utf8"));
                const domains = Array.isArray(payload.result) ? payload.result : [];
                const productionHosts = new Set(["chakod.com", "www.chakod.com"]);
                const attached = domains.filter((item) => productionHosts.has(item.hostname));
                if (!payload.success) {
                  console.error("Could not inspect Worker custom domains.");
                  process.exit(1);
                }
                if (attached.length) {
                  console.error("Production domain is already attached; refusing candidate-only deployment.");
                  console.error(JSON.stringify(attached));
                  process.exit(1);
                }
                console.log("Production domains remain detached; candidate deployment is safe.");
              '

      - name: Build production Worker
        run: npm run build:production

      - name: Upload production candidate version
        id: upload_version
        shell: bash
        run: |
          set -euo pipefail
          version_tag="production-candidate-${GITHUB_SHA:0:12}"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
          npx wrangler versions upload             --tag "$version_tag"             --message "Production candidate ${GITHUB_SHA}"

      - name: Deploy candidate to unattached production Worker
        shell: bash
        env:
          VERSION_TAG: ${{ steps.upload_version.outputs.version_tag }}
        run: |
          set -euo pipefail
          npx wrangler versions deploy             --version-tag "${VERSION_TAG}@100%"             --message "Production candidate ${GITHUB_SHA}"             -y

      - name: Enable temporary workers.dev verification URL
        id: workers_dev
        shell: bash
        run: |
          set -euo pipefail

          worker_subdomain_payload="$(curl --fail --silent --show-error             --request POST             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_PRODUCTION_WORKER_NAME}/subdomain"             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --header 'Content-Type: application/json'             --data '{"enabled":true,"previews_enabled":false}')"

          printf '%s' "$worker_subdomain_payload" | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            if (!payload.success || payload.result?.enabled !== true) {
              console.error("Could not enable the production candidate workers.dev URL.");
              process.exit(1);
            }
          '

          account_subdomain_payload="$(curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"

          account_subdomain="$(printf '%s' "$account_subdomain_payload" | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const subdomain = String(payload.result?.subdomain || "").trim();
            if (!payload.success || !subdomain) process.exit(1);
            process.stdout.write(subdomain);
          ')"

          candidate_url="https://${CLOUDFLARE_PRODUCTION_WORKER_NAME}.${account_subdomain}.workers.dev"
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "Production candidate URL: $candidate_url"

      - name: Smoke production candidate homepage
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.workers_dev.outputs.url }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl             --silent             --show-error             --location             --retry 5             --retry-delay 3             --retry-all-errors             --connect-timeout 10             --max-time 30             --output "$body_file"             --write-out '%{http_code}'             --header 'Accept: text/html'             "$CANDIDATE_URL/")"
          echo "Candidate homepage HTTP $status"
          test "$status" = "200"
          test -s "$body_file"

      - name: Smoke production candidate D1 route
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.workers_dev.outputs.url }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl             --silent             --show-error             --location             --retry 5             --retry-delay 3             --retry-all-errors             --connect-timeout 10             --max-time 30             --output "$body_file"             --write-out '%{http_code}'             --header 'Accept: application/json'             "$CANDIDATE_URL/api/featured-showrooms")"
          echo "Candidate D1 route HTTP $status"
          test "$status" = "200"
          test -s "$body_file"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$body_file"

      - name: Smoke production candidate auth validation
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.workers_dev.outputs.url }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl             --silent             --show-error             --location             --retry 3             --retry-delay 2             --retry-all-errors             --connect-timeout 10             --max-time 25             --output "$body_file"             --write-out '%{http_code}'             --request POST             --header 'Accept: application/json'             --header 'Content-Type: application/json'             --data '{"mobile":"0900000000","accept_terms":true}'             "$CANDIDATE_URL/api/auth/send-code")"
          echo "Candidate auth validation HTTP $status"
          test "$status" = "400"
          grep -q '"success":false' "$body_file"

      - name: Verify five-minute candidate stability
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.workers_dev.outputs.url }}
        run: |
          set -euo pipefail
          sleep 300
          status="$(curl             --silent             --show-error             --location             --retry 5             --retry-delay 3             --retry-all-errors             --connect-timeout 10             --max-time 30             --output /dev/null             --write-out '%{http_code}'             "$CANDIDATE_URL/")"
          echo "Five-minute candidate homepage HTTP $status"
          test "$status" = "200"

      - name: Verify production domains stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             | node -e '
                const fs = require("fs");
                const payload = JSON.parse(fs.readFileSync(0, "utf8"));
                const domains = Array.isArray(payload.result) ? payload.result : [];
                const productionHosts = new Set(["chakod.com", "www.chakod.com"]);
                const attached = domains.filter((item) => productionHosts.has(item.hostname));
                if (!payload.success || attached.length) {
                  console.error("Production domain state changed unexpectedly.");
                  process.exit(1);
                }
                console.log("Verified: chakod.com and www.chakod.com remain untouched.");
              '
