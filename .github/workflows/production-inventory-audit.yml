name: Production inventory audit

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/production-inventory-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Read-only Cloudflare inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Ensure Cloudflare credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare read credentials."
            exit 1
          fi

      - name: Read Cloudflare inventory with least privilege
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          request() {
            local name="$1"
            local url="$2"
            local status
            status="$(curl --silent --show-error \
              --output "artifacts/${name}.json" \
              --write-out '%{http_code}' \
              "$url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)"
            printf '%s' "${status:-000}" > "artifacts/${name}.status"
          }

          # Informational account-wide reads. Lack of broader list permissions
          # must not force us to widen the deployment token.
          request workers "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          request d1 "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100"

          # Read the existing candidate production Worker directly. The response
          # is kept only inside the ephemeral runner; the artifact contains a
          # redacted summary and never raw binding values.
          request production_worker_settings "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/chakod-car/settings"

          # This endpoint is already required by the proven staging deploy path.
          request domains "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"

      - name: Summarize Chakod resources only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          function readResult(name) {
            const status = fs.readFileSync(`artifacts/${name}.status`, 'utf8').trim() || '000';
            let payload = null;
            try {
              payload = JSON.parse(fs.readFileSync(`artifacts/${name}.json`, 'utf8'));
            } catch {}
            return { status, payload, available: status === '200' && payload?.success === true };
          }

          const workersResult = readResult('workers');
          const d1Result = readResult('d1');
          const productionSettingsResult = readResult('production_worker_settings');
          const domainsResult = readResult('domains');

          if (!domainsResult.available) {
            console.error(`Worker custom-domain inventory is unavailable (HTTP ${domainsResult.status}).`);
            process.exit(1);
          }

          const workers = workersResult.available && Array.isArray(workersResult.payload.result)
            ? workersResult.payload.result
            : [];
          const d1 = d1Result.available && Array.isArray(d1Result.payload.result)
            ? d1Result.payload.result
            : [];
          const domains = Array.isArray(domainsResult.payload.result) ? domainsResult.payload.result : [];

          const chakodWorkers = workers
            .map((item) => String(item.id || item.name || '').trim())
            .filter((name) => /chakod/i.test(name));

          const chakodD1 = d1
            .filter((item) => /chakod/i.test(String(item.name || '')))
            .map((item) => ({
              name: String(item.name || '').trim(),
              uuid: String(item.uuid || item.id || '').trim(),
            }));

          const chakodDomains = domains
            .filter((item) => /(^|\.)chakod\.com$/i.test(String(item.hostname || '')))
            .map((item) => ({
              hostname: String(item.hostname || '').trim(),
              service: String(item.service || '').trim(),
              environment: String(item.environment || '').trim(),
            }));

          const workersLines = workersResult.available
            ? (chakodWorkers.length ? chakodWorkers.map((name) => `- ${name}`) : ['- none'])
            : [`- permission-limited (HTTP ${workersResult.status}); token scope was not widened`];

          const d1Lines = d1Result.available
            ? (chakodD1.length
                ? chakodD1.map((item) => `- ${item.name}${item.uuid ? ` — ${item.uuid}` : ''}`)
                : ['- none'])
            : [`- permission-limited (HTTP ${d1Result.status}); token scope was not widened`];

          const domainLines = chakodDomains.length
            ? chakodDomains.map((item) => `- ${item.hostname} -> ${item.service}${item.environment ? ` (${item.environment})` : ''}`)
            : ['- none'];

          let productionBindingLines;
          if (!productionSettingsResult.available) {
            productionBindingLines = [
              `- settings unavailable (HTTP ${productionSettingsResult.status}); no production binding was guessed`,
            ];
          } else {
            const bindings = Array.isArray(productionSettingsResult.payload.result?.bindings)
              ? productionSettingsResult.payload.result.bindings
              : [];
            productionBindingLines = bindings.map((binding) => {
              const name = String(binding?.name || '').trim() || '(unnamed)';
              const type = String(binding?.type || '').trim() || 'unknown';
              if (type === 'd1') {
                const databaseId = String(binding?.id || binding?.database_id || '').trim();
                return `- ${name}: ${type}${databaseId ? ` — database_id=${databaseId}` : ''}`;
              }
              return `- ${name}: ${type}`;
            });
            if (!productionBindingLines.length) productionBindingLines = ['- none'];
          }

          const lines = [
            '# Chakod Cloudflare production inventory',
            '',
            'Read-only audit. No Worker, DNS, route, secret or database mutation was performed.',
            '',
            '## Workers containing “chakod”',
            ...workersLines,
            '',
            '## D1 databases containing “chakod”',
            ...d1Lines,
            '',
            '## Existing chakod-car Worker bindings (values redacted)',
            ...productionBindingLines,
            '',
            '## Worker custom domains under chakod.com',
            ...domainLines,
            '',
          ];

          fs.writeFileSync('artifacts/production-inventory-summary.md', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

      - name: Record public endpoint status without changing anything
        shell: bash
        run: |
          set -euo pipefail
          chakod_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://chakod.com/ || true)"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://api.chakod.com/ || true)"
          {
            echo "## Public HTTP snapshot"
            echo "- https://chakod.com/ -> ${chakod_status:-unreachable}"
            echo "- https://api.chakod.com/ -> ${api_status:-unreachable}"
          } | tee -a artifacts/production-inventory-summary.md

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-inventory-audit
          path: artifacts/production-inventory-summary.md
          retention-days: 7
