name: Remove banner reservations

on:
  push:
    branches:
      - ci/admin-ai-regression-2026-08-27
    paths:
      - "scripts/remove-banner-reservations.py"
      - ".github/workflows/remove-banner-reservations.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/admin-ai-regression-2026-08-27
          fetch-depth: 0

      - name: Apply banner reservation cleanup
        run: python3 scripts/remove-banner-reservations.py

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify retired reservation code is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '/account/ads|banner-reservations|رزرو بنر|رزرو تبلیغ منطقه‌ای|reserve_banner|review_banner|pending_banners' app lib worker; then
            echo 'Banner reservation remnants still exist.' >&2
            exit 1
          fi
          if grep -RInE 'drizzle-orm|drizzle-kit|D1Database' app lib worker types package.json; then
            echo 'Retired D1 reservation dependencies still exist.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chakod-ci-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Remove retired banner reservation feature"
          git push origin HEAD:ci/admin-ai-regression-2026-08-27
