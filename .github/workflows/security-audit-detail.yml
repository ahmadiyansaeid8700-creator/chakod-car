name: One-shot remaining dependency audit detail

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/security-audit-detail.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Generate durable audit report
        run: |
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const vulns = audit.vulnerabilities || {};
          const meta = audit.metadata?.vulnerabilities || {};
          const rows = Object.entries(vulns)
            .filter(([,v]) => ['critical','high','moderate','low'].includes(v.severity))
            .sort((a,b) => ({critical:0,high:1,moderate:2,low:3}[a[1].severity] - {critical:0,high:1,moderate:2,low:3}[b[1].severity]))
            .map(([name,v]) => {
              const via = (v.via || []).map((x) => typeof x === 'string' ? x : `${x.title || x.name || 'advisory'} (${x.url || ''})`).join('; ');
              const fix = typeof v.fixAvailable === 'object' ? `${v.fixAvailable.name || ''}@${v.fixAvailable.version || ''}${v.fixAvailable.isSemVerMajor ? ' (major)' : ''}` : String(v.fixAvailable);
              return `| ${name} | ${v.severity} | ${v.isDirect ? 'direct' : 'transitive'} | ${String(v.range).replace(/\|/g,'\\|')} | ${fix.replace(/\|/g,'\\|')} | ${via.replace(/\|/g,'\\|')} |`;
            });
          const out = [
            '# Remaining dependency audit details', '',
            `- critical: ${meta.critical ?? 0}`,
            `- high: ${meta.high ?? 0}`,
            `- moderate: ${meta.moderate ?? 0}`,
            `- low: ${meta.low ?? 0}`,
            '',
            '| Package | Severity | Direct | Vulnerable range | Fix available | Via |',
            '|---|---|---|---|---|---|',
            ...rows,
            '',
            'No `npm audit fix --force` was executed by this workflow.',
            ''
          ];
          fs.writeFileSync('docs/SECURITY-REMAINING-AUDIT.md', out.join('\n'));
          NODE
      - name: Commit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY-REMAINING-AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record remaining dependency advisories"
          git fetch origin agent/launch-3-local-baseline
          git rebase origin/agent/launch-3-local-baseline
          git push origin HEAD:agent/launch-3-local-baseline
