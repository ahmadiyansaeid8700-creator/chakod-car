name: One-shot verify Cloudflare security toolchain

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/security-cloudflare-1511.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Upgrade Cloudflare toolchain without force
        run: npm install --save-exact --save-dev @cloudflare/vite-plugin@1.51.1 wrangler@latest
      - name: Launch source checks
        run: npm run check:launch
      - name: Portable production bundle
        run: npm run build:preflight
      - name: Portable runtime smoke
        run: npm run smoke:portable
      - name: Audit upgraded dependency graph
        run: |
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          fs.writeFileSync('docs/SECURITY-CLOUDFLARE-1.51.1-RESULT.md', [
            '# نتیجه ارتقای امنیتی Cloudflare Toolchain', '',
            `- @cloudflare/vite-plugin: ${pkg.devDependencies['@cloudflare/vite-plugin']}`,
            `- wrangler: ${pkg.devDependencies.wrangler}`,
            `- vulnerabilities: critical=${v.critical ?? '?'}, high=${v.high ?? '?'}, moderate=${v.moderate ?? '?'}, low=${v.low ?? '?'}`,
            '- TypeScript/contracts: success',
            '- portable build: success',
            '- portable runtime smoke: success',
            '- npm audit fix --force: NOT USED', ''
          ].join('\n'));
          if ((v.critical ?? 0) > 0 || (v.high ?? 0) > 0) process.exit(1);
          NODE
      - name: Commit only verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/SECURITY-CLOUDFLARE-1.51.1-RESULT.md
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: verify Cloudflare 1.51.1 toolchain"
          git fetch origin agent/launch-3-local-baseline
          git rebase origin/agent/launch-3-local-baseline
          git push origin HEAD:agent/launch-3-local-baseline
