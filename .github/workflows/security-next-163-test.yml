name: One-shot verify Next 16.3 security upgrade

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/security-next-163-test.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Upgrade Next family without force
        run: npm install --save-exact next@16.3.0 eslint-config-next@16.3.0
      - run: npm run check:launch
      - run: npm run build:preflight
      - run: npm run smoke:portable
      - name: Capture verified audit
        run: |
          npm audit --json > /tmp/next163-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/next163-audit.json','utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          fs.writeFileSync('docs/SECURITY-NEXT-16.3-RESULT.md', [
            '# نتیجه بررسی Next 16.3', '',
            `- Next: ${pkg.dependencies.next}`,
            `- eslint-config-next: ${pkg.devDependencies['eslint-config-next']}`,
            `- vulnerabilities: critical=${v.critical ?? '?'}, high=${v.high ?? '?'}, moderate=${v.moderate ?? '?'}, low=${v.low ?? '?'}`,
            '- TypeScript/contracts: success',
            '- portable build: success',
            '- portable runtime smoke: success',
            '- npm audit fix --force: NOT USED', ''
          ].join('\n'));
          if ((v.critical ?? 0) > 0) process.exit(1);
          NODE
      - name: Commit only verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/SECURITY-NEXT-16.3-RESULT.md
          git commit -m "security: verify Next 16.3 against launch gates"
          git fetch origin agent/launch-3-local-baseline
          git rebase origin/agent/launch-3-local-baseline
          git push origin HEAD:agent/launch-3-local-baseline
