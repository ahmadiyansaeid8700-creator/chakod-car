name: One-shot security upgrade Next and React runtime

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/security-upgrade-next-rsc.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install current lockfile
        id: install_current
        continue-on-error: true
        run: npm ci

      - name: Upgrade stable Next.js and React runtime security patches
        id: upgrade
        if: steps.install_current.outcome == 'success'
        continue-on-error: true
        run: npm install --save-exact next@16.2.12 eslint-config-next@16.2.12 react@19.2.8 react-dom@19.2.8 react-server-dom-webpack@19.2.8

      - name: Launch source checks
        id: source_checks
        if: steps.upgrade.outcome == 'success'
        continue-on-error: true
        run: npm run check:launch

      - name: Critical dependency audit gate
        id: critical_audit
        if: steps.upgrade.outcome == 'success'
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Portable Vinext build preflight
        id: build_preflight
        if: steps.upgrade.outcome == 'success'
        continue-on-error: true
        run: npm run build:preflight

      - name: Portable runtime smoke
        id: runtime_smoke
        if: steps.build_preflight.outcome == 'success'
        continue-on-error: true
        run: npm run smoke:portable

      - name: Capture audit JSON
        if: steps.upgrade.outcome == 'success'
        continue-on-error: true
        run: npm audit --json > /tmp/chakod-audit-after.json || true

      - name: Write durable upgrade report
        if: always()
        env:
          INSTALL_CURRENT: ${{ steps.install_current.outcome }}
          UPGRADE: ${{ steps.upgrade.outcome }}
          SOURCE_CHECKS: ${{ steps.source_checks.outcome }}
          CRITICAL_AUDIT: ${{ steps.critical_audit.outcome }}
          BUILD_PREFLIGHT: ${{ steps.build_preflight.outcome }}
          RUNTIME_SMOKE: ${{ steps.runtime_smoke.outcome }}
        run: |
          mkdir -p docs
          NEXT_VERSION="$(node -p "require('./package.json').dependencies.next" 2>/dev/null || echo unavailable)"
          REACT_VERSION="$(node -p "require('./package.json').dependencies.react" 2>/dev/null || echo unavailable)"
          REACT_DOM_VERSION="$(node -p "require('./package.json').dependencies['react-dom']" 2>/dev/null || echo unavailable)"
          ESLINT_NEXT_VERSION="$(node -p "require('./package.json').devDependencies['eslint-config-next']" 2>/dev/null || echo unavailable)"
          RSC_VERSION="$(node -p "require('./package.json').devDependencies['react-server-dom-webpack']" 2>/dev/null || echo unavailable)"
          AUDIT_SUMMARY="unavailable"
          if [ -f /tmp/chakod-audit-after.json ]; then
            AUDIT_SUMMARY="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/chakod-audit-after.json','utf8')); const v=j.metadata?.vulnerabilities||{}; console.log('critical='+(v.critical??'?')+', high='+(v.high??'?')+', moderate='+(v.moderate??'?')+', low='+(v.low??'?'))" 2>/dev/null || echo unavailable)"
          fi
          VERIFIED=false
          if [ "$INSTALL_CURRENT" = success ] && [ "$UPGRADE" = success ] && [ "$SOURCE_CHECKS" = success ] && [ "$CRITICAL_AUDIT" = success ] && [ "$BUILD_PREFLIGHT" = success ] && [ "$RUNTIME_SMOKE" = success ]; then
            VERIFIED=true
          fi
          cat > docs/SECURITY-UPGRADE-NEXT-RSC-RESULT.md <<EOF
          # نتیجه ارتقای امنیتی Next / React Runtime

          - Target Next: 16.2.12
          - Target eslint-config-next: 16.2.12
          - Target React: 19.2.8
          - Target React DOM: 19.2.8
          - Target react-server-dom-webpack: 19.2.8
          - Resolved Next in package.json: $NEXT_VERSION
          - Resolved eslint-config-next in package.json: $ESLINT_NEXT_VERSION
          - Resolved React in package.json: $REACT_VERSION
          - Resolved React DOM in package.json: $REACT_DOM_VERSION
          - Resolved RSC in package.json: $RSC_VERSION
          - Verified for commit: $VERIFIED
          - npm ci: $INSTALL_CURRENT
          - dependency upgrade: $UPGRADE
          - source/type/contracts: $SOURCE_CHECKS
          - critical audit: $CRITICAL_AUDIT
          - portable build: $BUILD_PREFLIGHT
          - portable runtime smoke: $RUNTIME_SMOKE
          - audit summary after upgrade: $AUDIT_SUMMARY

          اگر Verified برابر true نباشد، package.json/package-lock.json نباید به عنوان ارتقای تاییدشده ثبت شوند.
          EOF

      - name: Commit verified update and report
        if: always()
        env:
          INSTALL_CURRENT: ${{ steps.install_current.outcome }}
          UPGRADE: ${{ steps.upgrade.outcome }}
          SOURCE_CHECKS: ${{ steps.source_checks.outcome }}
          CRITICAL_AUDIT: ${{ steps.critical_audit.outcome }}
          BUILD_PREFLIGHT: ${{ steps.build_preflight.outcome }}
          RUNTIME_SMOKE: ${{ steps.runtime_smoke.outcome }}
        run: |
          VERIFIED=false
          if [ "$INSTALL_CURRENT" = success ] && [ "$UPGRADE" = success ] && [ "$SOURCE_CHECKS" = success ] && [ "$CRITICAL_AUDIT" = success ] && [ "$BUILD_PREFLIGHT" = success ] && [ "$RUNTIME_SMOKE" = success ]; then
            VERIFIED=true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECURITY-UPGRADE-NEXT-RSC-RESULT.md
          if [ "$VERIFIED" = true ]; then
            git add package.json package-lock.json
          else
            git restore package.json package-lock.json 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if [ "$VERIFIED" = true ]; then
            git commit -m "security: verify stable Next and React runtime upgrade"
          else
            git commit -m "docs: record rejected stable Next React upgrade"
          fi
          git push origin HEAD:agent/launch-3-local-baseline
