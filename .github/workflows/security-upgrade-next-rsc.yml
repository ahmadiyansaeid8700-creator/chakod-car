name: One-shot security upgrade Next and RSC

on:
  push:
    branches:
      - agent/launch-3-local-baseline
    paths:
      - .github/workflows/security-upgrade-next-rsc.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-3-local-baseline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Upgrade Next.js and React Server DOM security patches
        run: npm install --save-exact next@16.3.0 react-server-dom-webpack@19.2.8

      - name: Launch source checks
        run: npm run check:launch

      - name: Critical dependency audit gate
        run: npm audit --audit-level=critical

      - name: Portable Vinext build preflight
        run: npm run build:preflight

      - name: Portable runtime smoke
        run: npm run smoke:portable

      - name: Show remaining audit summary
        run: npm audit || true

      - name: Commit verified dependency update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next and RSC after launch gates"
          git push origin HEAD:agent/launch-3-local-baseline
