name: Service cover asset probe

on:
  push:
    branches:
      - diag/service-cover-assets

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/staging-service-cover-identity
          fetch-depth: 0

      - name: Download verified service covers into the repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/demo-business-covers

          names=(
            detailing-01.jpg
            detailing-02.jpg
            car-wash-01.jpg
            car-wash-02.jpg
            ppf-01.jpg
            tint-01.jpg
            wrap-01.jpg
            audio-01.jpg
            parts-01.jpg
            parts-02.jpg
            parts-03.jpg
            battery-01.jpg
            tire-01.jpg
            mechanic-01.jpg
            mechanic-02.jpg
            oil-change-01.jpg
            electrical-01.jpg
            electrical-02.jpg
          )
          urls=(
            'https://images.pexels.com/photos/17623850/pexels-photo-17623850.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/29504462/pexels-photo-29504462.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/14677029/pexels-photo-14677029.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/33093191/pexels-photo-33093191.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/36021355/pexels-photo-36021355.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/20036216/pexels-photo-20036216.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/10126661/pexels-photo-10126661.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/32667398/pexels-photo-32667398.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/19499386/pexels-photo-19499386.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/35503906/pexels-photo-35503906.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/11456554/pexels-photo-11456554.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/37177070/pexels-photo-37177070.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/6870316/pexels-photo-6870316.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/8478259/pexels-photo-8478259.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/7807035/pexels-photo-7807035.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/13065691/pexels-photo-13065691.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/4116193/pexels-photo-4116193.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
            'https://images.pexels.com/photos/4116172/pexels-photo-4116172.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop'
          )

          for i in "${!urls[@]}"; do
            target="public/demo-business-covers/${names[$i]}"
            curl --location --fail --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 45 "${urls[$i]}" --output "$target"
            mime="$(file --brief --mime-type "$target")"
            test "$mime" = "image/jpeg"
            test -s "$target"
            echo "MATERIALIZED=${names[$i]} BYTES=$(wc -c < "$target")"
          done

          test "$(find public/demo-business-covers -maxdepth 1 -type f -name '*.jpg' | wc -l)" = "18"

      - name: Commit service cover assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add public/demo-business-covers
          if git diff --cached --quiet; then
            echo 'Service cover assets are already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: add service demo cover photos'
          git push origin HEAD:fix/staging-service-cover-identity
