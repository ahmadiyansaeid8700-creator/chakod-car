name: Businesses staging root-cause probe

on:
  push:
    branches:
      - diag/service-cover-assets

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare fixture short-circuit, list route, and legacy upstream
        shell: bash
        run: |
          set -euo pipefail
          list_status="$(curl --location --silent --show-error --output /tmp/list.json --write-out '%{http_code}' 'https://staging.chakod.com/api/businesses?home=1&limit=50')"
          slug_status="$(curl --location --silent --show-error --output /tmp/slug.json --write-out '%{http_code}' 'https://staging.chakod.com/api/businesses?slug=test-business-9500001')"
          upstream_status="$(curl --location --silent --show-error --output /tmp/upstream.txt --write-out '%{http_code}' 'https://api.chakod.com/api/public-businesses.php?home=1&limit=50')"

          echo "STAGING_LIST_HTTP=$list_status"
          echo "STAGING_TEST_SLUG_HTTP=$slug_status"
          echo "LEGACY_UPSTREAM_HTTP=$upstream_status"
          echo '--- staging list body ---'
          head -c 600 /tmp/list.json || true
          echo
          echo '--- staging test slug body ---'
          head -c 600 /tmp/slug.json || true
          echo
          echo '--- upstream body ---'
          head -c 600 /tmp/upstream.txt || true
          echo

          test "$slug_status" = "200"
          test "$list_status" = "$upstream_status"
