name: Service cover live staging probe

on:
  push:
    branches:
      - diag/service-cover-assets

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging service API returns self-hosted distinct covers
        shell: bash
        run: |
          set -euo pipefail
          api=/tmp/businesses.json
          curl --location --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            'https://staging.chakod.com/api/businesses?home=1&limit=50' \
            --output "$api"

          python3 - "$api" > /tmp/covers.txt <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          items = data.get('items') or []
          services = [x for x in items if x.get('business_type') in {'car_service','parts_store','repair_shop'} and str(x.get('id','')).startswith('950')]
          assert len(services) == 18, f'expected 18 staging demo service businesses, got {len(services)}'
          covers = [x.get('cover_url') for x in services]
          assert all(isinstance(x, str) and x.startswith('https://staging.chakod.com/demo-business-covers/') and x.endswith('.jpg') for x in covers), covers
          assert len(set(covers)) == 18, f'expected 18 unique covers, got {len(set(covers))}'
          print('\n'.join(covers))
          PY

          test "$(wc -l < /tmp/covers.txt)" = "18"
          echo 'API_SERVICE_COVERS_OK=18'

      - name: Verify every live staging cover resolves as an image
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r url; do
            i=$((i + 1))
            target="/tmp/live-cover-${i}.jpg"
            curl --location --fail --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 "$url" --output "$target"
            mime="$(file --brief --mime-type "$target")"
            test "$mime" = "image/jpeg"
            test -s "$target"
            echo "LIVE_COVER_OK=${i} MIME=${mime} BYTES=$(wc -c < "$target") URL=${url}"
          done < /tmp/covers.txt
          test "$i" = "18"
          echo 'ALL_LIVE_SERVICE_COVERS_OK=18'
