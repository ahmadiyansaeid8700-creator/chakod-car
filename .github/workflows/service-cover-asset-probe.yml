name: Service cover asset probe

on:
  push:
    branches:
      - diag/service-cover-assets

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every curated cover resolves to an image
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://unsplash.com/photos/HNCSCpWrVJA/download?force=true'
            'https://unsplash.com/photos/eP8h7YVhFHk/download?force=true'
            'https://unsplash.com/photos/xe-e69j6-Ds/download?force=true'
            'https://unsplash.com/photos/ovGrEUgrkyE/download?force=true'
            'https://unsplash.com/photos/UZUzvJEvKnI/download?force=true'
            'https://unsplash.com/photos/iFQpqbLMOFU/download?force=true'
            'https://unsplash.com/photos/nDlIe54btMg/download?force=true'
            'https://unsplash.com/photos/8MXNZCgAah0/download?force=true'
            'https://unsplash.com/photos/jlakazXU72w/download?force=true'
            'https://unsplash.com/photos/pWGUMQSWBwI/download?force=true'
            'https://unsplash.com/photos/Ng3xrviPrhk/download?force=true'
            'https://unsplash.com/photos/8k_T1EwTySs/download?force=true'
            'https://unsplash.com/photos/9mxviB2BBOE/download?force=true'
            'https://unsplash.com/photos/i2kOA2p0DTo/download?force=true'
            'https://unsplash.com/photos/yeMpSqF8Z-8/download?force=true'
            'https://unsplash.com/photos/bEGTsOCnHro/download?force=true'
            'https://unsplash.com/photos/gW34cv-Ojjs/download?force=true'
            'https://unsplash.com/photos/DPNfzltNOeQ/download?force=true'
          )

          for i in "${!urls[@]}"; do
            target="/tmp/service-cover-${i}.img"
            curl --location --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 45 "${urls[$i]}" --output "$target"
            mime="$(file --brief --mime-type "$target")"
            case "$mime" in
              image/*) ;;
              *) echo "Unexpected MIME for ${urls[$i]}: $mime" >&2; exit 1 ;;
            esac
            test -s "$target"
            echo "COVER_OK=$((i + 1)) MIME=$mime BYTES=$(wc -c < "$target")"
          done

          echo "ALL_SERVICE_COVERS_OK=${#urls[@]}"
