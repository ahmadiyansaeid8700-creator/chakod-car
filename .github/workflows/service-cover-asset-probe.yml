name: Service cover asset probe

on:
  push:
    branches:
      - diag/service-cover-assets

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and verify direct image CDN URLs
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            HNCSCpWrVJA
            eP8h7YVhFHk
            xe-e69j6-Ds
            ovGrEUgrkyE
            UZUzvJEvKnI
            iFQpqbLMOFU
            nDlIe54btMg
            8MXNZCgAah0
            jlakazXU72w
            pWGUMQSWBwI
            Ng3xrviPrhk
            8k_T1EwTySs
            9mxviB2BBOE
            i2kOA2p0DTo
            yeMpSqF8Z-8
            bEGTsOCnHro
            gW34cv-Ojjs
            DPNfzltNOeQ
          )

          for i in "${!ids[@]}"; do
            id="${ids[$i]}"
            page="/tmp/service-cover-${i}.html"
            target="/tmp/service-cover-${i}.img"
            curl --location --fail --silent --show-error --retry 2 --retry-all-errors \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              --connect-timeout 10 --max-time 45 "https://unsplash.com/photos/${id}" --output "$page"
            image_url="$(python3 -c 'import html,re,sys; t=open(sys.argv[1],encoding="utf-8").read(); m=re.search(r"<meta[^>]+property=\"og:image\"[^>]+content=\"([^\"]+)",t,re.I) or re.search(r"<meta[^>]+content=\"([^\"]+)\"[^>]+property=\"og:image\"",t,re.I); print(html.unescape(m.group(1)) if m else "")' "$page")"
            case "$image_url" in
              https://images.unsplash.com/*) ;;
              *) echo "Unexpected image source for ${id}: ${image_url}" >&2; exit 1 ;;
            esac
            curl --location --fail --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 45 "$image_url" --output "$target"
            mime="$(file --brief --mime-type "$target")"
            case "$mime" in
              image/*) ;;
              *) echo "Unexpected MIME for ${id}: $mime" >&2; exit 1 ;;
            esac
            echo "COVER_SOURCE ${id} ${image_url}"
            echo "COVER_OK=$((i + 1)) MIME=$mime BYTES=$(wc -c < "$target")"
          done

          echo "ALL_SERVICE_COVERS_OK=${#ids[@]}"
