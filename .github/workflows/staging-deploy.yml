name: Deploy staging Worker

on:
  push:
    branches:
      - agent/launch-3-local-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chakod-staging-deploy
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: chakod-car-staging

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check:launch

      - name: Verify local D1 migrations
        run: npm run d1:verify

      - name: Ensure Cloudflare credentials exist
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Deploy staging Worker
        run: npx wrangler deploy
