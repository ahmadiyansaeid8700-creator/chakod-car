name: Deploy staging Worker

on:
  push:
    branches:
      - agent/launch-3-local-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chakod-staging-deploy
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: chakod-car-staging

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check:launch

      - name: Verify local D1 migrations
        run: npm run d1:verify

      - name: Ensure Cloudflare credentials exist
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Deploy staging Worker
        run: npx wrangler deploy

      - name: Smoke staging auth route
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 25 \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"mobile":"0900000000","accept_terms":true}' \
            'https://staging.chakod.com/api/auth/send-code')"

          cat "$body_file"
          echo
          echo "HTTP $status"

          if [ "$status" != "400" ]; then
            echo "Expected auth route validation HTTP 400, got $status."
            exit 1
          fi

          if ! grep -q '"success":false' "$body_file"; then
            echo "Auth smoke response is not the expected JSON payload."
            exit 1
          fi
