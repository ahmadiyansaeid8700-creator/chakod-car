name: Temporary home rails GREEN

on:
  push:
    branches:
      - fix/home-desktop-rail-controls

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-desktop-rail-controls
          fetch-depth: 1
      - name: Apply approved homepage rail changes once
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f"expected source not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))
              return True

          # Selected showroom: concise title + shared horizontal rail controls.
          replace_once(
              "app/components/HomeFeaturedShowrooms.tsx",
              'import styles from "./HomeFeaturedShowrooms.module.css";\n',
              'import styles from "./HomeFeaturedShowrooms.module.css";\nimport HomeHorizontalRail from "./HomeHorizontalRail";\n',
          )
          replace_once(
              "app/components/HomeFeaturedShowrooms.tsx",
              '<h2>نمایشگاه‌های منتخب</h2>',
              '<h2>نمایشگاه منتخب</h2>',
          )
          replace_once(
              "app/components/HomeFeaturedShowrooms.tsx",
              '''        <div className={styles.dealerRail}>\n          {resolvedDealers.items.slice(0, 8).map((dealer) => (\n            <ShowroomCard density="compact" key={dealer.key} showroom={dealer} />\n          ))}\n        </div>''',
              '''        <HomeHorizontalRail\n          ariaLabel="نمایشگاه منتخب"\n          className="homeRailShell--dealers"\n          showControls={resolvedDealers.items.length > 0}\n        >\n          {resolvedDealers.items.slice(0, 8).map((dealer) => (\n            <ShowroomCard density="compact" key={dealer.key} showroom={dealer} />\n          ))}\n        </HomeHorizontalRail>''',
          )

          # Vehicle rails: concise visible labels + controls whenever the rail has content.
          replace_once(
              "app/components/HomePublicListingsClient.tsx",
              'showControls={hasListings && listings.length + nationwideListings.length > 3}',
              'showControls={hasListings || hasNationwideFallback}',
          )
          replace_once(
              "app/components/HomePublicListingsClient.tsx",
              'kicker="خودروهای لوکس"',
              'kicker="لوکس"',
          )
          replace_once(
              "app/components/HomePublicListingsClient.tsx",
              'title="خودروهای لوکس منتخب"',
              'title="لوکس"',
          )
          replace_once(
              "app/components/HomePublicListingsClient.tsx",
              'kicker="خودروهای منطقه آزاد"',
              'kicker="منطقه آزاد"',
          )
          replace_once(
              "app/components/HomePublicListingsClient.tsx",
              'title="خودروهای منطقه آزاد"',
              'title="منطقه آزاد"',
          )

          # Service rails: reuse the same accessible desktop controls while preserving cards.
          replace_once(
              "app/components/HomeFeaturedBusinesses.tsx",
              'import { useEffect, useState } from "react";\n',
              'import { useEffect, useState } from "react";\nimport HomeHorizontalRail from "./HomeHorizontalRail";\n',
          )
          replace_once(
              "app/components/HomeFeaturedBusinesses.tsx",
              '''      <div className="featuredBusinessRail">\n        {hasItems''',
              '''      <HomeHorizontalRail\n        ariaLabel={config.kicker}\n        className="homeRailShell--businesses"\n        showControls={hasItems}\n      >\n        {hasItems''',
          )
          replace_once(
              "app/components/HomeFeaturedBusinesses.tsx",
              '''      </div>\n      )}\n    </section>''',
              '''      </HomeHorizontalRail>\n      )}\n    </section>''',
          )

          # Desktop positioning/sizing for the newly shared rails.
          replace_once(
              "app/home.css",
              '.homeRailShell--dealers .homeRailControls { top: -68px; left: 0; }',
              '.homeRailShell--dealers .homeRailControls { top: -68px; left: 108px; }',
          )
          css_marker = '.homeRailShell--businesses .homeRailTrack {'
          css_path = Path("app/home.css")
          css = css_path.read_text()
          if css_marker not in css:
              anchor = '''.homeRailShell--dealers .homeRailControl {\n  color: #1d4ed8;\n  border-color: #cfe2ff;\n  background: rgba(255, 255, 255, 0.96);\n  box-shadow: 0 10px 28px rgba(37, 99, 235, 0.08);\n}\n'''
              block = anchor + '''\n.homeRailShell--businesses .homeRailTrack {\n  display: flex;\n  gap: 12px;\n  padding: 2px 1px 10px;\n}\n\n.homeRailShell--businesses .homeRailTrack > *:not(.featuredBusinessNationwideDivider) {\n  flex: 0 0 clamp(292px, 28vw, 342px);\n}\n\n.homeRailShell--businesses .featuredBusinessNationwideDivider {\n  flex: 0 0 42px;\n}\n\n.homeRailShell--businesses .homeRailControls {\n  top: -46px;\n  left: 92px;\n}\n'''
              if anchor not in css:
                  raise SystemExit("dealer control anchor not found in app/home.css")
              css_path.write_text(css.replace(anchor, block, 1))

          # Update the older heading contract to the newly approved singular label.
          replace_once(
              "tests/homepage-contract.test.mjs",
              'assert.match(showrooms, /<h2>نمایشگاه‌های منتخب<\\/h2>/);',
              'assert.match(showrooms, /<h2>نمایشگاه منتخب<\\/h2>/);',
          )
          PY
      - name: Commit GREEN implementation if changed
        run: |
          if git diff --quiet; then
            echo "GREEN already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/HomeFeaturedShowrooms.tsx app/components/HomePublicListingsClient.tsx app/components/HomeFeaturedBusinesses.tsx app/home.css tests/homepage-contract.test.mjs
          git commit -m "fix: unify homepage rail labels and desktop controls"
          git push origin HEAD:fix/home-desktop-rail-controls
