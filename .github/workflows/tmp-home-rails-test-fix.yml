name: Temporary home rails test fix

on:
  push:
    branches:
      - fix/home-desktop-rail-controls

permissions:
  contents: write

jobs:
  fix-old-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-desktop-rail-controls
      - name: Update stale showroom heading contract once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/homepage-contract.test.mjs')
          text = p.read_text()
          old = '  assert.match(showrooms, /<h2>نمایشگاه‌های منتخب<\\/h2>/);\n  assert.doesNotMatch(showrooms, /نمایشگاه‌های منتخب چاکود/);'
          new = '  assert.match(showrooms, /<h2>نمایشگاه منتخب<\\/h2>/);\n  assert.doesNotMatch(showrooms, /نمایشگاه‌های منتخب چاکود/);'
          if old in text:
              p.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('stale heading assertion not found')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/homepage-contract.test.mjs
          git commit -m "test: align mobile showroom heading contract"
          git push origin HEAD:fix/home-desktop-rail-controls
